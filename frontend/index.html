<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Donanex — çok satıcılı teknoloji mağazası. Binlerce ürün, onlarca mağaza." />
    <title>Donanex</title>

    <!--
      Buradaki başlık ve açıklama BAŞLANGIÇ değeridir; gezinme sırasında
      src/lib/sayfaBilgisi.js her sayfanınkiyle değiştirir.

      Aşağıdaki og:/twitter: etiketleri ise SABİT kalır ve bilinçli olarak
      öyle bırakıldı: sosyal medya önizlemesini çıkaran robotlar (WhatsApp,
      X, LinkedIn) JavaScript ÇALIŞTIRMAZ, yalnızca sunucudan gelen bu ham
      HTML'i okur. Bu yüzden hangi sayfa paylaşılırsa paylaşılsın önizleme
      aynı görünür. Sayfa başına farklı önizleme istenirse sunucu tarafı
      render (SSR) gerekir — ayrı ve büyük bir karar.
    -->
    <meta property="og:site_name" content="Donanex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Donanex — çok satıcılı teknoloji mağazası" />
    <meta
      property="og:description"
      content="Onlarca mağaza, tek sepet, tek ödeme. Üye olmadan da sipariş verebilirsiniz."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Donanex — çok satıcılı teknoloji mağazası" />
    <meta
      name="twitter:description"
      content="Onlarca mağaza, tek sepet, tek ödeme. Üye olmadan da sipariş verebilirsiniz."
    />
    <!--
      Sekme simgesi artık emoji değil, markanın kendi işareti.
      Uygulama olarak kurulduğunda (PWA) da aynı işaret kullanılıyor.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      theme-color: Android'de adres çubuğunun ve uygulama penceresinin
      rengi. Manifest'teki değerle aynı tutuldu, yoksa kurulu uygulama ile
      tarayıcı sekmesi iki farklı renk gösteriyor.
    -->
    <meta name="theme-color" content="#12151b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Donanex" />
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
