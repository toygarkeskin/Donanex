<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Donanex — çok satıcılı teknoloji mağazası. Binlerce ürün, onlarca mağaza." />
    <title>Donanex</title>

    <!--
      Buradaki başlık ve açıklama BAŞLANGIÇ değeridir; gezinme sırasında
      src/lib/sayfaBilgisi.js her sayfanınkiyle değiştirir.

      Aşağıdaki og:/twitter: etiketleri ise SABİT kalır ve bilinçli olarak
      öyle bırakıldı: sosyal medya önizlemesini çıkaran robotlar (WhatsApp,
      X, LinkedIn) JavaScript ÇALIŞTIRMAZ, yalnızca sunucudan gelen bu ham
      HTML'i okur. Bu yüzden hangi sayfa paylaşılırsa paylaşılsın önizleme
      aynı görünür. Sayfa başına farklı önizleme istenirse sunucu tarafı
      render (SSR) gerekir — ayrı ve büyük bir karar.
    -->
    <meta property="og:site_name" content="Donanex" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Donanex — çok satıcılı teknoloji mağazası" />
    <meta
      property="og:description"
      content="Onlarca mağaza, tek sepet, tek ödeme. Üye olmadan da sipariş verebilirsiniz."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Donanex — çok satıcılı teknoloji mağazası" />
    <meta
      name="twitter:description"
      content="Onlarca mağaza, tek sepet, tek ödeme. Üye olmadan da sipariş verebilirsiniz."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%92%BB%3C/text%3E%3C/svg%3E" />
    <script src="/tema.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
