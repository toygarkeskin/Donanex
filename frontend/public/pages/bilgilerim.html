<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hesabım - Bilgisayar Bilgileri</title>

    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/assets/css/pages/bilgilerim.css">
    <!-- Ortak tipografi: Plus Jakarta Sans (arayüz), Lora (başlık), JetBrains Mono (fiyat/kod) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/css/base/typography.css">
    <link rel="stylesheet" href="/assets/css/base/components.css">
</head>

<body>

    <!-- NAVBAR -->
    <div data-site-nav></div>

    <!-- ANA İÇERİK -->
    <main class="container my-5">

        <div class="account-header mb-4 d-flex justify-content-between align-items-start flex-wrap gap-3">
            <div>
                <h1>Hesabım</h1>
                <p>Hesap bilgilerini, teslimat adresini ve siparişlerini buradan yönetebilirsin.</p>
            </div>
            <button type="button" id="cikisBtn" class="btn btn-danger btn-sm">
                <i class="bi bi-box-arrow-right"></i> Çıkış Yap
            </button>
        </div>

        <div id="genelMesaj" class="alert" role="status" hidden></div>

        <div id="yukleniyor" class="text-center py-5">
            <div class="spinner-border text-dark" role="status"></div>
            <p class="mt-3">Hesap bilgilerin yükleniyor...</p>
        </div>

        <div id="bilgiAlani" hidden>

            <div class="row g-4">

                <!-- HESAP BİLGİLERİ -->
                <div class="col-lg-5">
                    <section class="account-card h-100">

                        <div class="card-title-row">
                            <i class="bi bi-person-circle"></i>
                            <h2>Hesap Bilgilerim</h2>
                        </div>

                        <form id="profilForm" class="mb-4">
                            <div class="mb-3">
                                <label for="adSoyad" class="form-label">Ad Soyad</label>
                                <input type="text" id="adSoyad" class="form-control" minlength="2" maxlength="150" autocomplete="name" required>
                            </div>
                            <div class="account-info">
                                <label>E-posta</label>
                                <p id="email">-</p>
                            </div>
                            <button type="submit" id="profilKaydetBtn" class="btn btn-dark btn-sm">Bilgilerimi Kaydet</button>
                            <p id="profilMesaj" class="mt-2 mb-0" role="status"></p>
                        </form>

                        <div class="card-title-row">
                            <i class="bi bi-shield-lock"></i>
                            <h2>Şifre Değiştir</h2>
                        </div>
                        <form id="sifreForm">
                            <div class="mb-2">
                                <label for="mevcutSifre" class="form-label">Mevcut şifre</label>
                                <input type="password" id="mevcutSifre" class="form-control" maxlength="128" autocomplete="current-password" required>
                            </div>
                            <div class="mb-2">
                                <label for="yeniSifre" class="form-label">Yeni şifre (en az 8 karakter, harf ve rakam)</label>
                                <input type="password" id="yeniSifre" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
                            </div>
                            <div class="mb-3">
                                <label for="yeniSifreTekrar" class="form-label">Yeni şifre (tekrar)</label>
                                <input type="password" id="yeniSifreTekrar" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
                            </div>
                            <button type="submit" id="sifreKaydetBtn" class="btn btn-dark btn-sm">Şifreyi Değiştir</button>
                            <p id="sifreMesaj" class="mt-2 mb-0" role="status"></p>
                        </form>

                    </section>
                </div>

                <!-- ADRES BİLGİLERİ -->
                <div class="col-lg-7">
                    <section class="account-card">

                        <div class="card-title-row">
                            <i class="bi bi-geo-alt"></i>
                            <h2>Teslimat Adresim</h2>
                        </div>

                        <form id="adresForm">

                            <div class="mb-3">
                                <label for="adresAd" class="form-label">Ad Soyad</label>
                                <input
                                    type="text"
                                    id="adresAd"
                                    name="fullName"
                                    class="form-control"
                                    maxlength="150"
                                    autocomplete="name"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="adresTelefon" class="form-label">Telefon</label>
                                <input
                                    type="tel"
                                    id="adresTelefon"
                                    name="phone"
                                    class="form-control"
                                    maxlength="30"
                                    autocomplete="tel"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label for="adresMetni" class="form-label">Açık Adres</label>
                                <textarea
                                    id="adresMetni"
                                    name="address"
                                    class="form-control"
                                    rows="4"
                                    maxlength="1000"
                                    autocomplete="street-address"
                                    required></textarea>
                            </div>

                            <button type="submit" id="adresKaydetBtn" class="btn btn-dark">
                                <i class="bi bi-save"></i> Adresi Kaydet
                            </button>

                            <p id="adresMesaj" class="mt-3 mb-0" role="status"></p>

                        </form>

                    </section>
                </div>

                <!-- SİPARİŞ GEÇMİŞİ -->
                <div class="col-12">
                    <section class="account-card">

                        <div class="card-title-row">
                            <i class="bi bi-box-seam"></i>
                            <h2>Sipariş Geçmişim</h2>
                        </div>

                        <div id="siparisler">
                            <p class="text-muted">Siparişlerin yükleniyor...</p>
                        </div>

                    </section>
                </div>

            </div>

        </div>

        <div id="hataAlani" class="alert alert-danger" hidden></div>

    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">© 2026 Bilgisayar Bilgileri</p>
    </footer>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
<script type="module" src="/assets/js/pages/bilgilerim.js"></script>
</body>
</html>
