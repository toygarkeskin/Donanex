<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sipariş Takibi</title>
  <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ortak tipografi: Plus Jakarta Sans (arayüz), Lora (başlık), JetBrains Mono (fiyat/kod) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/css/base/typography.css">
    <link rel="stylesheet" href="/assets/css/base/components.css">
</head>
<body class="bg-light">
  <div data-site-nav></div>
  <main class="container py-5 takip-sayfasi">
    <h1 class="mb-2">Sipariş Takibi</h1>
    <p class="text-secondary">Sipariş numaranı ve sipariş oluşturulurken verilen takip kodunu gir.</p>
    <form id="takipForm" class="card card-body shadow-sm mb-3">
      <label for="orderId" class="form-label">Sipariş numarası</label>
      <input id="orderId" class="form-control mb-3" inputmode="numeric" autocomplete="off" required>
      <label for="trackingCode" class="form-label">Sipariş takip kodu</label>
      <input id="trackingCode" class="form-control mb-3" autocomplete="off" required>
      <button id="sorgulaBtn" class="btn btn-primary" type="submit">Siparişi sorgula</button>
    </form>
    <p id="mesaj" role="status" aria-live="polite"></p>
    <section id="sonuc" class="card card-body d-none" aria-live="polite"></section>
  </main>
<script src="/assets/vendor/bootstrap/js/bootstrap.bundle.min.js" defer></script>
<script type="module" src="/assets/js/pages/siparis-takip.js"></script>
</body>
</html>
