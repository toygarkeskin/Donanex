<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HESAP</title>

    <link href="/assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="/assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="/assets/css/pages/hesap.css">
    <!-- Ortak tipografi: Plus Jakarta Sans (arayüz), Lora (başlık), JetBrains Mono (fiyat/kod) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/assets/css/base/typography.css">
    <link rel="stylesheet" href="/assets/css/base/components.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="/anasayfa.html">
                Bilgisayar Bilgileri
            </a>

        </div>
    </nav>

    <div class="backdrop"></div>

    <div class="login-box">

        <div class="icon">
            <i class="bi bi-person-circle"></i>
        </div>

        <h2 id="baslik">
            OTURUM AÇ VEYA<br>
            YENİ HESAP OLUŞTUR
        </h2>

        <p>
            Hesabına giriş yaparak siparişlerini takip edebilir,
            hesap bilgilerini görüntüleyebilir ve teslimat adresini
            yönetebilirsin.
        </p>

        <div class="d-flex gap-2 mb-4">

            <button type="button" id="girisSekme" class="btn btn-dark w-50">
                GİRİŞ YAP
            </button>

            <button type="button" id="kayitSekme" class="btn btn-outline-dark w-50">
                KAYIT OL
            </button>

        </div>

        <form id="loginForm">

            <div id="adAlani" class="mb-3" hidden>
                <input
                    type="text"
                    id="ad"
                    class="form-control"
                    placeholder="Ad soyad"
                    minlength="2"
                    maxlength="150"
                    autocomplete="name">
            </div>

            <div class="mb-3">
                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="E-posta"
                    maxlength="254"
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-3">
                <input
                    type="password"
                    id="sifre"
                    class="form-control"
                    placeholder="Şifre"
                    minlength="8"
                    maxlength="128"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="form-check mb-3" id="oturumAlani">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="oturum">

                <label class="form-check-label" for="oturum">
                    Oturumu sürdür
                </label>

            </div>

            <p id="uyari" role="status" aria-live="polite"></p>

            <button type="submit" id="gonderButonu">
                OTURUM AÇ
            </button>

        </form>

        <a href="/parolaunut.html" class="parola">
            PAROLANI MI UNUTTUN?
        </a>

    </div>
<script type="module" src="/assets/js/pages/hesap.js"></script>
</body>
</html>
