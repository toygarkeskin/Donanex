limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    charset utf-8;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Güvenlik başlıkları (location içinde add_header kullanılmaz; kullanılırsa bunlar ezilir)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    error_page 404 /pages/404.html;

    # API isteklerini backend konteynerine yönlendir
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        # $http_host port bilgisini korur; backend'in Origin denetimi buna göre karşılaştırır.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Sayfalar pages/ altındadır ama adresleri kısadır: /urunler veya /urunler.html
    location = / {
        expires -1;
        try_files /pages/anasayfa.html =404;
    }

    location ~ ^/([a-z0-9-]+)(\.html)?$ {
        expires -1;
        try_files /pages/$1.html =404;
    }

    location = /favicon.ico {
        access_log off;
        return 204;
    }

    location /pages/ {
        internal;
        expires -1;
    }

    location /assets/images/ {
        expires 7d;
        try_files $uri =404;
    }

    location /assets/vendor/ {
        expires 30d;
        try_files $uri =404;
    }

    # CSS/JS her seferinde ETag ile doğrulanır; dağıtımdan sonra eski dosya kalmaz.
    location /assets/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
