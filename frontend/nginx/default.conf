limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 2m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Güvenlik başlıkları. Not: bir location içinde add_header kullanılırsa
    # buradakiler o location için tamamen kaybolur.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API ve OAuth uçları backend'e gider
    location ~ ^/(api|oauth|\.well-known)/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        # $http_host portu korur; backend'in Origin denetimi buna göre karşılaştırır.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Vite parmak izli dosya adı üretir; içerik değişince ad da değişir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        try_files $uri =404;
    }

    # Tek sayfa uygulaması: bilinmeyen yol index.html'e düşer
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
