# Tüm backend testleri (birim + mimari + gerçek PostgreSQL ile API):
#   docker compose -f docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from tests
#   docker compose -f docker-compose.test.yml down -v
#
# Tek kullanımlık veritabanı kullanır; gerçek veriye ve gerçek SMTP'ye dokunmaz.

name: bilgisayar-bilgileri-test

services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ./backend
      target: test
    environment:
      NODE_ENV: test
      TEST_DB_HOST: test-db
      TEST_DB_PORT: 5432
      TEST_DB_NAME: test
      TEST_DB_USER: test
      TEST_DB_PASSWORD: test-only-password
    depends_on:
      test-db:
        condition: service_healthy
